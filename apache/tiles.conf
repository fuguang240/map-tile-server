# 地图瓦片静态服务配置
# 放置于 /etc/httpd/conf.d/tiles.conf

Alias /tiles /var/www/tiles

<Directory /var/www/tiles>
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted

    # 瓦片资源缓存 1 天，降低重复请求压力
    <FilesMatch "\.(png|jpg|jpeg|webp)$">
        Header set Cache-Control "max-age=86400, public"
    </FilesMatch>
</Directory>

Alias /map /var/www/html/map
<Directory /var/www/html/map>
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
